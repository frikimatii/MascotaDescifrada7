<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo | +COTAS</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <header class="header">
        <div class="container header__nav">
            <a href="index.html" class="header__logo">
                <img src="img/logo.jpeg" alt="+COTAS Logo" class="header__logo-img">
            </a>
            <nav id="header-nav" class="header__menu" aria-label="Categorías principales"></nav>
            <div class="header__actions">
                <form id="search-form" class="search-bar">
                    <input type="text" placeholder="Buscar..." required>
                </form>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="layout-grid">
            <div class="main-content" id="article-content">
                <!-- El contenido del artículo se inyectará aquí vía JS -->
                <p>Cargando artículo...</p>
            </div>
            <aside id="sidebar-container">
                <!-- Sidebar -->
            </aside>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer__bottom">
                <p>&copy; 2026 +COTAS.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
