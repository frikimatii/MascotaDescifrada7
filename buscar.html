<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar | +COTAS</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <header class="header">
        <div class="container header__nav">
            <a href="index.html" class="header__logo">
                <img src="img/logo.jpeg" alt="+COTAS Logo" class="header__logo-img">
            </a>
            <div class="header__actions">
                <form id="search-form" class="search-bar">
                    <input type="text" placeholder="Buscar..." required>
                </form>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="layout-grid">
            <div class="main-content">
                <h1 id="search-title" class="section-title">Resultados de búsqueda</h1>
                <div id="search-results" class="posts-grid">
                    <!-- Posts cargados por JS -->
                    <p>Buscando...</p>
                </div>
            </div>
            <aside id="sidebar-container"></aside>
        </div>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
